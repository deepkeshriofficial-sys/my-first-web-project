<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub User Finder</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>


<body class="min-h-screen bg-[#020617] font-inter text-white">


    <!-- ================= BACKGROUND ================= -->

    <div class="pointer-events-none fixed inset-0 overflow-hidden">

        <!-- Blue Glow -->
        <div
            class="absolute -left-40 top-1/3
                   h-[500px] w-[500px]
                   rounded-full
                   bg-blue-600/20
                   blur-[150px]">
        </div>

        <!-- Purple Glow -->
        <div
            class="absolute -right-40 top-1/4
                   h-[500px] w-[500px]
                   rounded-full
                   bg-indigo-600/20
                   blur-[150px]">
        </div>

        <!-- Bottom Glow -->
        <div
            class="absolute bottom-[-200px]
                   left-1/2
                   h-[500px] w-[700px]
                   -translate-x-1/2
                   rounded-full
                   bg-blue-700/10
                   blur-[150px]">
        </div>

    </div>



    <!-- ================= MAIN ================= -->

    <main
        class="relative flex min-h-screen
               items-center justify-center
               px-5 py-12">


        <div class="w-full max-w-2xl">


            <!-- ================= HEADER ================= -->

            <div class="mb-8 text-center">

                <h1
                    class="text-3xl font-bold
                           tracking-tight
                           sm:text-4xl">

                    GitHub User Finder

                </h1>


                <p
                    class="mt-3 text-sm
                           text-slate-400
                           sm:text-base">

                    Search and view GitHub user profiles in style

                </p>

            </div>



            <!-- ================= SEARCH ================= -->

            <div
                class="flex w-full
                       items-center gap-2
                       rounded-lg
                       border border-white/10
                       bg-white/[0.06]
                       p-1.5
                       shadow-2xl
                       shadow-blue-950/20
                       backdrop-blur-xl">


                <!-- Input -->

                <input
                    type="text"
                    placeholder="Enter GitHub username..."
                    class="h-12 min-w-0
                           flex-1
                           bg-transparent
                           px-4
                           text-sm
                           text-white
                           outline-none
                           placeholder:text-slate-500 
                           inputuser"
                >


                <!-- Search -->

                <button
                    class=" search h-12
                           shrink-0
                           rounded-lg
                           bg-gradient-to-r
                           from-blue-500
                           to-cyan-400
                           px-6
                           text-sm
                           font-semibold
                           text-white
                           shadow-lg
                           shadow-blue-500/20
                           transition
                           hover:from-blue-400
                           hover:to-cyan-300
                           active:scale-95">

                    Search

                </button>

            </div>



            <!-- ================= PROFILE CARD ================= -->

            <div
                class=" card mt-5
                       rounded-xl
                       border border-white/10
                       bg-white/[0.055]
                       p-6
                       shadow-2xl
                       shadow-black/20
                       backdrop-blur-xl">


                <!-- TOP PROFILE -->

                

            </div>



            <!-- ================= FOOTER ================= -->

            <p
                class="mt-7
                       text-center
                       text-xs
                       text-slate-500">

                Built with
                <span class="text-red-400">♥</span>
                using GitHub API

            </p>

        </div>

    </main>
    <script src="app.js"></script>
</body>

</html>
